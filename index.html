<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมุดโทรศัพท์กองทัพเรือ ประจำปีงบประมาณ 2570</title>
  
  <!-- Google Font: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    * {
      font-family: 'Prompt', sans-serif !important;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-3 sm:p-6 font-sans">

  <!-- ================= หน้าจอยืนยันรหัสผ่าน (Login Screen) ================= -->
  <div id="authScreen" class="fixed inset-0 bg-blue-950 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 sm:p-8 text-center space-y-6">
      <div class="w-16 h-16 bg-blue-100 text-blue-900 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
        🔒
      </div>
      <div>
        <h2 class="text-2xl font-bold text-blue-900">เข้าสู่ระบบสมุดโทรศัพท์กองทัพเรือ ประจำปีงบประมาณ 2570</h2>
        <p class="text-sm text-gray-500 mt-1">กรุณากรอกรหัสผ่านเพื่อยืนยันตัวตนก่อนใช้งาน</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <input type="password" id="passwordInput" placeholder="กรอกรหัสผ่าน..." 
                 class="w-full p-3.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-600 text-center text-lg tracking-widest" required>
          <p id="errorMessage" class="text-red-500 text-xs mt-2 hidden">รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง</p>
        </div>
        <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white py-3 rounded-xl font-medium shadow-md transition">
          เข้าสู่ระบบ
        </button>
      </form>
    </div>
  </div>

  <!-- ================= หน้าจอสมุดโทรศัพท์ (หลัก) ================= -->
  <div id="mainApp" class="max-w-4xl mx-auto hidden space-y-5">
    
    <!-- Header -->
    <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-200 relative">
      <button onclick="handleLogout()" class="absolute right-4 top-4 text-xs bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg border border-red-200 transition font-medium">
        ออกจากระบบ 🔒
      </button>
      <div class="text-center pr-20 sm:pr-0">
        <h1 class="text-xl sm:text-3xl font-bold text-blue-900">สมุดโทรศัพท์กองทัพเรือ ประจำปีงบประมาณ 2570</h1>
        <p class="text-xs sm:text-sm text-gray-500 mt-1">ระบบค้นหารายชื่อและเบอร์โทรศัพท์</p>
      </div>
    </div>
    
    <!-- ช่องค้นหา -->
    <div>
      <input type="text" id="searchInput" onkeyup="filterContacts()" 
             placeholder="🔍 ค้นหา สำนักงาน, ยศ, ชื่อ, นามสกุล, ตำแหน่ง, เบอร์โทร..." 
             class="w-full p-3.5 sm:p-4 rounded-xl border border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 text-gray-800 bg-white text-base">
    </div>

    <!-- ส่วนเลือกสำนักงาน (ปรับปรุงใหม่ ไม่ล้นหน้าจอ) -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
      <div class="flex items-center justify-between">
        <label for="officeSelect" class="text-sm font-semibold text-gray-700 flex items-center gap-1.5">
          <span>📂</span> เลือกสำนักงาน:
        </label>
        <span id="totalOfficeBadge" class="text-xs bg-gray-100 text-gray-600 px-2.5 py-0.5 rounded-full font-medium"></span>
      </div>

      <!-- Dropdown สำหรับจอทุกขนาด เลือกง่าย ไม่ล้นจอ -->
      <div>
        <select id="officeSelect" onchange="onOfficeSelectChange(this.value)" 
                class="w-full p-3 rounded-lg border border-gray-300 bg-gray-50 text-gray-800 font-medium text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-blue-600 cursor-pointer shadow-sm">
          <!-- ตัวเลือกสำนักงานจะถูกโหลดที่นี่ -->
        </select>
      </div>

      <!-- แท็บปุ่มลอยเรียงต่อกัน (Wrap) พอดีหน้าจอ สำหรับจอกว้าง -->
      <div id="officeButtonsWrap" class="flex flex-wrap gap-2 pt-1 border-t border-gray-100 mt-2">
        <!-- ปุ่มแท็บจะสร้างอัตโนมัติ -->
      </div>
    </div>

    <!-- รายการแสดงผลตามสำนักงานที่เลือก -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div id="activeOfficeHeader" class="bg-blue-900 text-white px-4 sm:px-6 py-3.5 flex items-center justify-between">
        <h2 id="currentOfficeTitle" class="font-bold text-base sm:text-lg flex items-center gap-2">🏢 กรุณาเลือกสำนักงาน</h2>
        <span id="currentOfficeCount" class="bg-blue-800 text-blue-100 text-xs px-2.5 py-1 rounded-full font-medium shrink-0">0 รายการ</span>
      </div>
      <div id="contactList" class="divide-y divide-gray-100">
        <div class="text-center py-10 text-gray-500">กำลังโหลดข้อมูลสมุดโทรศัพท์...</div>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // *** วาง URL CSV จาก Google Sheets ของคุณที่นี่ ***
    // -------------------------------------------------------------
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT-mD711zr90-qDLfHNBIqaFtoPollgPBtpwIeUJ_plDR4Ew9r6cRCrievQazYMhQ/pub?output=csv';
    const CORRECT_PASSWORD = 'rtn@2027';

    let allContacts = [];
    let currentDept = '';
    let selectedOffice = '';
    let officeList = [];

    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('isLoggedIn') === 'true') {
        showApp();
      }
    });

    function handleLogin(event) {
      event.preventDefault();
      const inputPass = document.getElementById('passwordInput').value;
      const errorMsg = document.getElementById('errorMessage');

      if (inputPass === CORRECT_PASSWORD) {
        sessionStorage.setItem('isLoggedIn', 'true');
        showApp();
      } else {
        errorMsg.classList.remove('hidden');
        document.getElementById('passwordInput').value = '';
      }
    }

    function showApp() {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      loadContactsData();
    }

    function handleLogout() {
      sessionStorage.removeItem('isLoggedIn');
      location.reload();
    }

    function loadContactsData() {
      if (allContacts.length > 0) return;

      Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allContacts = results.data.map(item => {
            if (item['หน่วยงาน'] && item['หน่วยงาน'].trim() !== '') {
              currentDept = item['หน่วยงาน'].trim();
            } else {
              item['หน่วยงาน'] = currentDept;
            }
            return item;
          });

          initOfficeNavigation(allContacts);
        }
      });
    }

    // สร้างเมนูเลือกสำนักงาน
    function initOfficeNavigation(data) {
      officeList = [];
      data.forEach(item => {
        const fullName = item['ยศ - ชื่อ - สกุล - คำต่อท้าย'] || 
                         `${item['ยศ'] || ''}${item['ชื่อ'] || ''} ${item['นามสกุล'] || ''} ${item['คำต่อท้าย'] || ''}`.trim();
        if (!fullName) return;

        const office = item['สำนักงาน'] && item['สำนักงาน'].trim() !== '' ? item['สำนักงาน'].trim() : 'สำนักงานอื่นๆ';
        if (!officeList.includes(office)) {
          officeList.push(office);
        }
      });

      if (officeList.length > 0) {
        selectedOffice = officeList[0];
      }

      document.getElementById('totalOfficeBadge').textContent = `รวม ${officeList.length} สำนักงาน`;
      renderOfficeControls();
      renderContacts(data, selectedOffice);
    }

    function renderOfficeControls() {
      // 1. เติมตัวเลือกใน Dropdown
      const selectEl = document.getElementById('officeSelect');
      selectEl.innerHTML = '';
      officeList.forEach(office => {
        const opt = document.createElement('option');
        opt.value = office;
        opt.textContent = `🏢 ${office}`;
        if (office === selectedOffice) opt.selected = true;
        selectEl.appendChild(opt);
      });

      // 2. เติมปุ่มแท็บ (Flex Wrap เรียงต่อหลายบรรทัดอัตโนมัติ ไม่ล้นจอ)
      const btnContainer = document.getElementById('officeButtonsWrap');
      btnContainer.innerHTML = '';
      officeList.forEach(office => {
        const btn = document.createElement('button');
        const isActive = office === selectedOffice;
        btn.className = `px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition ${
          isActive 
            ? 'bg-blue-900 text-white shadow-sm' 
            : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
        }`;
        btn.innerHTML = `🏢 ${office}`;
        btn.onclick = () => onOfficeSelectChange(office);
        btnContainer.appendChild(btn);
      });
    }

    function onOfficeSelectChange(officeName) {
      selectedOffice = officeName;
      document.getElementById('searchInput').value = '';
      renderOfficeControls();
      renderContacts(allContacts, selectedOffice);
    }

    // แสดงรายชื่อของสำนักงานที่เลือก
    function renderContacts(data, officeName) {
      const listDiv = document.getElementById('contactList');
      const titleEl = document.getElementById('currentOfficeTitle');
      const countEl = document.getElementById('currentOfficeCount');

      const filteredByOffice = data.filter(item => {
        const fullName = item['ยศ - ชื่อ - สกุล - คำต่อท้าย'] || 
                         `${item['ยศ'] || ''}${item['ชื่อ'] || ''} ${item['นามสกุล'] || ''} ${item['คำต่อท้าย'] || ''}`.trim();
        if (!fullName) return false;
        const office = item['สำนักงาน'] && item['สำนักงาน'].trim() !== '' ? item['สำนักงาน'].trim() : 'สำนักงานอื่นๆ';
        return office === officeName;
      });

      titleEl.innerHTML = `🏢 ${officeName}`;
      countEl.textContent = `${filteredByOffice.length} รายการ`;
      listDiv.innerHTML = '';

      if (filteredByOffice.length === 0) {
        listDiv.innerHTML = '<div class="text-center py-10 text-gray-500">ไม่พบรายชื่อในสำนักงานนี้</div>';
        return;
      }

      filteredByOffice.forEach(item => {
        const fullName = item['ยศ - ชื่อ - สกุล - คำต่อท้าย'] || 
                         `${item['ยศ'] || ''}${item['ชื่อ'] || ''} ${item['นามสกุล'] || ''} ${item['คำต่อท้าย'] || ''}`.trim();
        const dept = item['หน่วยงาน'] || '';
        const position = item['ตำแหน่ง'] || '';
        const phoneNavy = item['โทรศัพท์ ทร.'] && item['โทรศัพท์ ทร.'] !== '-' ? item['โทรศัพท์ ทร.'] : null;
        const phoneMobile = item['โทรศัพท์มือถือ1'] && item['โทรศัพท์มือถือ1'] !== '-' ? item['โทรศัพท์มือถือ1'] : null;

        const row = document.createElement('div');
        row.className = 'p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-gray-50 transition';
        row.innerHTML = `
          <div class="space-y-0.5">
            <h3 class="font-bold text-gray-900 text-base sm:text-lg">${fullName}</h3>
            <p class="text-sm font-semibold text-blue-800">${position}</p>
            <p class="text-xs text-gray-400">${dept}</p>
            <div class="flex flex-wrap gap-4 pt-1.5 text-sm">
              ${phoneNavy ? `<span class="text-gray-700">☎️ ทร.: <strong class="text-gray-900">${phoneNavy}</strong></span>` : ''}
              ${phoneMobile ? `<span class="text-gray-700">📱 มือถือ: <strong class="text-gray-900">${phoneMobile}</strong></span>` : ''}
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            ${phoneMobile ? `
              <a href="tel:${phoneMobile.replace(/[^0-9+]/g, '')}" 
                 class="w-full sm:w-auto text-center bg-green-600 hover:bg-green-700 text-white px-3.5 py-1.5 rounded-lg font-medium text-xs sm:text-sm flex items-center justify-center gap-1 shadow-sm">
                📞 โทรออก
              </a>
            ` : ''}
          </div>
        `;
        listDiv.appendChild(row);
      });
    }

    // ฟังก์ชันค้นหาข้อมูล
    function filterContacts() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const listDiv = document.getElementById('contactList');
      const titleEl = document.getElementById('currentOfficeTitle');
      const countEl = document.getElementById('currentOfficeCount');

      if (!query) {
        renderContacts(allContacts, selectedOffice);
        return;
      }

      const filtered = allContacts.filter(item => {
        const fullName = (item['ยศ - ชื่อ - สกุล - คำต่อท้าย'] || '').toLowerCase();
        const firstName = (item['ชื่อ'] || '').toLowerCase();
        const lastName = (item['นามสกุล'] || '').toLowerCase();
        const rank = (item['ยศ'] || '').toLowerCase();
        const dept = (item['หน่วยงาน'] || '').toLowerCase();
        const office = (item['สำนักงาน'] || '').toLowerCase();
        const position = (item['ตำแหน่ง'] || '').toLowerCase();
        const phoneNavy = (item['โทรศัพท์ ทร.'] || '').toLowerCase();
        const phoneMobile = (item['โทรศัพท์มือถือ1'] || '').toLowerCase();

        return fullName.includes(query) || 
               firstName.includes(query) || 
               lastName.includes(query) || 
               rank.includes(query) || 
               dept.includes(query) || 
               office.includes(query) || 
               position.includes(query) || 
               phoneNavy.includes(query) || 
               phoneMobile.includes(query);
      });

      titleEl.innerHTML = `🔍 ผลการค้นหา: "${query}"`;
      countEl.textContent = `${filtered.length} รายการ`;
      listDiv.innerHTML = '';

      if (filtered.length === 0) {
        listDiv.innerHTML = '<div class="text-center py-10 text-gray-500">ไม่พบข้อมูลที่ค้นหา</div>';
        return;
      }

      filtered.forEach(item => {
        const fullName = item['ยศ - ชื่อ - สกุล - คำต่อท้าย'] || 
                         `${item['ยศ'] || ''}${item['ชื่อ'] || ''} ${item['นามสกุล'] || ''} ${item['คำต่อท้าย'] || ''}`.trim();
        const dept = item['หน่วยงาน'] || '';
        const office = item['สำนักงาน'] || '';
        const position = item['ตำแหน่ง'] || '';
        const phoneNavy = item['โทรศัพท์ ทร.'] && item['โทรศัพท์ ทร.'] !== '-' ? item['โทรศัพท์ ทร.'] : null;
        const phoneMobile = item['โทรศัพท์มือถือ1'] && item['โทรศัพท์มือถือ1'] !== '-' ? item['โทรศัพท์มือถือ1'] : null;

        const row = document.createElement('div');
        row.className = 'p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-gray-50 transition';
        row.innerHTML = `
          <div class="space-y-0.5">
            <div class="flex items-center gap-2">
              <span class="bg-blue-100 text-blue-900 text-xs px-2 py-0.5 rounded font-medium">${office}</span>
              <h3 class="font-bold text-gray-900 text-base sm:text-lg">${fullName}</h3>
            </div>
            <p class="text-sm font-semibold text-blue-800">${position}</p>
            <p class="text-xs text-gray-400">${dept}</p>
            <div class="flex flex-wrap gap-4 pt-1.5 text-sm">
              ${phoneNavy ? `<span class="text-gray-700">☎️ ทร.: <strong class="text-gray-900">${phoneNavy}</strong></span>` : ''}
              ${phoneMobile ? `<span class="text-gray-700">📱 มือถือ: <strong class="text-gray-900">${phoneMobile}</strong></span>` : ''}
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            ${phoneMobile ? `
              <a href="tel:${phoneMobile.replace(/[^0-9+]/g, '')}" 
                 class="w-full sm:w-auto text-center bg-green-600 hover:bg-green-700 text-white px-3.5 py-1.5 rounded-lg font-medium text-xs sm:text-sm flex items-center justify-center gap-1 shadow-sm">
                📞 โทรออก
              </a>
            ` : ''}
          </div>
        `;
        listDiv.appendChild(row);
      });
    }
  </script>
</body>
</html>
